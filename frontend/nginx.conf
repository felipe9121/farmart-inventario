# Única puerta de entrada: la SPA y la API en el mismo origen (sin CORS).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Ojo: una location con su propio add_header no hereda los del server, por eso se
    # repiten en las locations que agregan Cache-Control.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API y health check de Laravel -> PHP-FPM. nginx no necesita los archivos PHP:
    # siempre ejecuta public/index.php del contenedor app.
    location ~ ^/(api|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    # Assets con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    # SPA: cualquier otra ruta devuelve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
