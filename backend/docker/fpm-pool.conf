[www]
; Los workers ven las variables de entorno del contenedor.
clear_env = no
; Lo que la app escribe en stderr (LOG_CHANNEL=stderr) llega a `docker logs`.
catch_workers_output = yes
decorate_workers_output = no
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
